<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Show">
<meta name="theme-color" content="#241b4a">
<title>Quiz Show — TV</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--a:#e8505b;--b:#3a86ff;--c:#f6a609;--d:#2fbf71;--gold:#ffd166;
    --ink:#f5f2ff;--soft:#c4bce6;--dim:#8f86bd;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);min-height:100dvh;
    background:radial-gradient(1200px 700px at 85% -10%,#4a2a7a,transparent 55%),
      radial-gradient(900px 600px at 0% 110%,#2a2f7a,transparent 50%),
      linear-gradient(160deg,#241b4a,#1b1440);padding:24px}
  .wrap{max-width:1200px;margin:0 auto}
  .screen{display:none} .screen.on{display:block}
  h1{font-family:"Space Grotesk";font-weight:700}
  .gold{color:var(--gold)}

  /* ---- LOBBY ---- */
  .lobby{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:80dvh}
  .join{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:24px;padding:32px;text-align:center}
  .code{font-family:"Space Grotesk";font-weight:700;font-size:4.5rem;letter-spacing:8px;color:var(--gold);margin:6px 0 4px}
  #qr{background:#fff;padding:16px;border-radius:18px;display:inline-block;margin:14px 0}
  #qr img,#qr canvas{display:block}
  .url{color:var(--soft);word-break:break-all;font-size:1rem}
  .lobby-right h1{font-size:2.4rem;margin-bottom:4px}
  .kicker{color:var(--gold);font-family:"Space Grotesk";font-weight:600;letter-spacing:1px;margin-bottom:8px}
  .settings{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
  .settings label{font-size:.8rem;color:var(--dim);display:block;margin-bottom:4px;font-family:"Space Grotesk"}
  select{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:12px;font-family:inherit;font-size:1rem}
  .players{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;min-height:48px}
  .pill{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    font-weight:600;font-family:"Space Grotesk"}
  .pill.off{opacity:.4}
  .btn{border:none;cursor:pointer;font-family:"Space Grotesk";font-weight:700;font-size:1.3rem;color:#241245;
    background:var(--gold);padding:18px 26px;border-radius:16px;transition:.18s;box-shadow:0 12px 26px -12px rgba(255,209,102,.6)}
  .btn:hover{transform:translateY(-2px)} .btn:disabled{opacity:.4;cursor:default;transform:none}
  .btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:1rem;padding:12px 18px}
  .hint{color:var(--dim);font-size:.9rem;margin-top:10px}

  /* ---- JOGO ---- */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:"Space Grotesk";font-weight:600}
  .rc{color:var(--dim)} .rc b{color:var(--gold)}
  .track{height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .fill{height:100%;width:100%;background:linear-gradient(90deg,var(--d),var(--gold));transition:width 1s linear}
  .fill.warn{background:linear-gradient(90deg,var(--c),var(--a))}
  .game{display:grid;grid-template-columns:1fr 320px;gap:24px}
  .cat{display:inline-block;font-size:1rem;font-weight:700;color:#241b4a;background:var(--soft);
    padding:6px 16px;border-radius:999px;margin-bottom:14px}
  .q{font-family:"Space Grotesk";font-weight:600;font-size:2.2rem;line-height:1.25;margin-bottom:24px;min-height:2.2em}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{display:flex;align-items:center;gap:14px;border-radius:16px;padding:20px;color:#fff;font-size:1.3rem;
    font-weight:600;transition:.2s;background:#141018;border:2px solid rgba(255,255,255,.55)}
  .opt .tag{flex:0 0 40px;height:40px;display:grid;place-items:center;border-radius:10px;background:#fff;color:#141018;
    font-family:"Space Grotesk";font-weight:700}
  .opt.dim{filter:brightness(.5);opacity:.5}
  .opt.right{background:#fff;color:#141018;border-color:#fff}
  .opt.right .tag{background:#141018;color:#fff}
  .status{min-height:2em;margin-top:18px;font-family:"Space Grotesk";font-weight:600;font-size:1.4rem}
  .status.good{color:var(--d)} .status.bad{color:var(--a)} .status.neutral{color:var(--gold)}
  .board{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:18px}
  .board h3{font-family:"Space Grotesk";color:var(--dim);font-size:.9rem;letter-spacing:1px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;margin-bottom:8px;
    background:rgba(255,255,255,.05);font-family:"Space Grotesk";font-weight:600;font-size:1.15rem}
  .row .s{color:var(--gold)}
  .row.lead{background:rgba(255,209,102,.16);border:1px solid rgba(255,209,102,.4)}
  .controls{margin-top:22px;display:flex;gap:12px;justify-content:center}

  /* modo equipes */
  .modes{display:flex;gap:10px;margin:6px 0 4px}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--soft);padding:9px 14px;
    border-radius:999px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:"Space Grotesk"}
  .chip.sel{background:var(--gold);color:#2a1a4a;border-color:var(--gold)}
  .teamcols{display:flex;gap:12px}
  .teamcol{flex:1;border-radius:16px;padding:12px;border:2px solid transparent;background:rgba(255,255,255,.04)}
  .teamcol.blue{border-color:rgba(58,134,255,.4)} .teamcol.red{border-color:rgba(232,80,91,.4)}
  .teamcol h4{font-family:"Space Grotesk";font-size:.9rem;margin-bottom:8px}
  .teamcol.blue h4{color:#7cb0ff} .teamcol.red h4{color:#ff8b93}
  .teamscore{display:flex;gap:14px;margin-bottom:18px}
  .ts{flex:1;border-radius:16px;padding:14px 16px;border:2px solid transparent;text-align:center}
  .ts.blue{background:rgba(58,134,255,.14);border-color:rgba(58,134,255,.5)}
  .ts.red{background:rgba(232,80,91,.14);border-color:rgba(232,80,91,.5)}
  .ts .tn{font-family:"Space Grotesk";font-weight:600;font-size:1rem}
  .ts.blue .tn{color:#7cb0ff} .ts.red .tn{color:#ff8b93}
  .ts .tv{font-family:"Space Grotesk";font-weight:700;font-size:2.4rem}

  .fsbtn{position:fixed;top:14px;right:16px;z-index:60;border:1px solid var(--line);
    background:rgba(255,255,255,.08);color:var(--soft);font-family:"Space Grotesk";font-weight:600;
    font-size:.85rem;padding:9px 14px;border-radius:999px;cursor:pointer}
  .fsbtn:hover{border-color:var(--gold);color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;width:max-content;
    background:#141018;color:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;
    font-size:.95rem;line-height:1.4;z-index:80;box-shadow:0 14px 34px -10px rgba(0,0,0,.7);text-align:center}

  /* ---- FIM ---- */
  .over{text-align:center;padding-top:5vh}
  .winner{font-family:"Space Grotesk";font-weight:700;font-size:3rem;color:var(--gold);margin:10px 0 24px}
  .podium{max-width:520px;margin:0 auto 28px}
  @media (max-width:820px){.lobby,.game{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}

  /* celular deitado (paisagem, pouca altura): encaixa tudo na tela */
  @media (orientation:landscape) and (max-height:520px){
    body{padding:10px}
    h1{font-size:1.5rem}
    .top{margin-bottom:6px} .track{height:8px;margin-bottom:10px}
    .cat{font-size:.75rem;padding:4px 12px;margin-bottom:8px}
    .q{font-size:1.35rem;min-height:auto;margin-bottom:12px}
    .game{grid-template-columns:1fr 210px;gap:12px}
    .opts{grid-template-columns:1fr 1fr;gap:10px}
    .opt{padding:11px 12px;font-size:1rem}
    .opt .tag{flex-basis:30px;height:30px;font-size:.9rem}
    .status{font-size:1rem;margin-top:8px;min-height:1.1em}
    .controls{margin-top:10px}
    .btn{font-size:1rem;padding:12px 16px}
    .board{padding:12px} .board h3{margin-bottom:8px}
    .row{padding:7px 10px;font-size:1rem;margin-bottom:6px}
    .teamscore{margin-bottom:10px} .ts{padding:8px 10px} .ts .tv{font-size:1.6rem}
    /* lobby deitado */
    .lobby{grid-template-columns:1.1fr 1fr;gap:14px;min-height:auto;align-items:start}
    .join{padding:16px} .code{font-size:2.2rem;letter-spacing:5px}
    #qr{padding:8px;margin:8px 0} #qr img,#qr canvas{width:140px!important;height:140px!important}
    .url{font-size:.8rem} .lobby-right h1{font-size:1.5rem}
    .settings{margin:10px 0;gap:8px} select{padding:8px}
    .players{margin:8px 0;min-height:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <button id="fsBtn" class="fsbtn">⛶ Tela cheia</button>

  <!-- LOBBY -->
  <section id="lobby" class="screen on">
    <div class="lobby">
      <div class="join">
        <div class="kicker">ENTRE PELO CELULAR</div>
        <div id="qr"></div>
        <div>Sala <span class="code" id="code">----</span></div>
        <div class="url" id="url">carregando…</div>
      </div>
      <div class="lobby-right">
        <div class="kicker">◆ QUIZ SHOW ◆</div>
        <h1>Aguardando jogadores…</h1>
        <div><label style="font-size:.8rem;color:var(--dim);font-family:'Space Grotesk'">Modo</label>
          <div class="modes" id="modes">
            <button class="chip sel" data-m="solo">Individual</button>
            <button class="chip" data-m="team">Equipes 🔵🔴</button>
          </div>
        </div>
        <div class="settings">
          <div><label>Tema</label><select id="setCat"></select></div>
          <div><label>Perguntas</label>
            <select id="setCount"><option value="10">10</option><option value="20">20</option>
              <option value="30">30</option><option value="0">Todas</option></select></div>
          <div><label>Tempo</label>
            <select id="setTime"><option value="15">15s</option><option value="20" selected>20s</option>
              <option value="30">30s</option><option value="0">Sem limite</option></select></div>
          <div><label>Voz (leitura)</label>
            <select id="setVoice"><option value="full">Pergunta + opções</option>
              <option value="question">Só a pergunta</option><option value="off">Desligada</option></select></div>
          <div><label>Locutor (voz)</label>
            <select id="setVoiceName"><option value="">Padrão do aparelho</option></select></div>
          <div><label>Velocidade</label>
            <select id="setRate"><option value="0.8">Lenta</option><option value="1.03" selected>Normal</option>
              <option value="1.25">Rápida</option></select></div>
          <div><label>&nbsp;</label>
            <button class="chip" id="testVoice" style="cursor:pointer;padding:12px 14px">🔊 Testar voz</button></div>
        </div>
        <div class="players" id="lobbyPlayers"></div>
        <div class="teamcols" id="lobbyTeams" style="display:none">
          <div class="teamcol blue"><h4>🔵 Azul</h4><div id="teamBlueList"></div></div>
          <div class="teamcol red"><h4>🔴 Vermelha</h4><div id="teamRedList"></div></div>
        </div>
        <button class="btn" id="startBtn" disabled>Começar ▶</button>
        <div class="hint" id="lobbyHint">Precisa de pelo menos 2 jogadores conectados.</div>
      </div>
    </div>
  </section>

  <!-- JOGO -->
  <section id="game" class="screen">
    <div class="top">
      <span class="rc">Sala <b id="gCode">----</b></span>
      <span id="counter">1 / 10</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="game">
      <div>
        <span class="cat" id="cat">Tema</span>
        <div class="q" id="q">…</div>
        <div class="opts" id="opts"></div>
        <div class="status neutral" id="status">Aperte o botão no celular para responder!</div>
        <div class="controls">
          <button class="btn ghost" id="nextBtn">Próxima ⏭</button>
          <button class="btn ghost" id="restartBtn">Reiniciar ↺</button>
        </div>
      </div>
      <div class="board">
        <h3>PLACAR</h3>
        <div class="teamscore" id="teamScore" style="display:none">
          <div class="ts blue"><div class="tn">🔵 Azul</div><div class="tv" id="tsBlue">0</div></div>
          <div class="ts red"><div class="tn">🔴 Vermelha</div><div class="tv" id="tsRed">0</div></div>
        </div>
        <div id="board"></div>
      </div>
    </div>
  </section>

  <!-- FIM -->
  <section id="over" class="screen">
    <div class="over">
      <div class="kicker">FIM DE JOGO</div>
      <div class="winner" id="winner">🏆</div>
      <div class="podium board"><div id="finalBoard"></div></div>
      <button class="btn" id="againBtn">Jogar de novo ↺</button>
    </div>
  </section>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const socket = io();
let ROOM = null, LETTERS = ["A","B","C","D"], curTime = 0, timerInt = null, MODE = "solo", buzzWindow = 0;

// ---- Tela cheia ----
function fsSupported(){ const el=document.documentElement; return !!(el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen); }
function goFullscreen(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(req){ try{ const r=req.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
}
function exitFullscreen(){ const ex=document.exitFullscreen||document.webkitExitFullscreen; if(ex) try{ ex.call(document); }catch(e){} }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 8000); }
$("#fsBtn").onclick = ()=>{
  if(document.fullscreenElement || document.webkitFullscreenElement){ exitFullscreen(); return; }
  if(fsSupported()){ goFullscreen(); }
  else { toast("📱 Tela cheia pelo botão não é suportada neste aparelho (iPhone).<br>Toque em <b>Compartilhar</b> → <b>\"Adicionar à Tela de Início\"</b> e abra o jogo pelo ícone criado."); }
};
document.addEventListener("fullscreenchange", ()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Sair" : "⛶ Tela cheia"; });

// ---- Áudio (Web Audio, sem arquivos) ----
const Sfx = (()=>{
  let ctx;
  const ensure=()=>{ try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); }catch(e){} return ctx; };
  const tone=(freq,dur,type="sine",gain=0.15,when=0)=>{ const c=ensure(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(c.destination); const t=c.currentTime+when;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.03); };
  return {
    unlock:ensure,
    tick(){ tone(880,0.08,"square",0.12); },
    go(){ tone(523,0.1,"sine",0.15); tone(784,0.15,"sine",0.15,0.1); },
    correct(){ tone(660,0.12,"sine",0.2); tone(990,0.18,"sine",0.2,0.12); },
    wrong(){ tone(160,0.32,"sawtooth",0.22); },
    timeup(){ tone(300,0.25,"square",0.18); tone(200,0.3,"square",0.18,0.12); }
  };
})();
document.addEventListener("click", ()=>Sfx.unlock(), { once:true });

// ---- Sons de acerto/erro (arquivos MP3) ----
const sndCorrect = new Audio("acerto.mp3");
const sndWrong = new Audio("erro.mp3");
function playCorrect(){ try{ sndCorrect.currentTime=0; sndCorrect.play(); }catch(e){} }
function playWrong(){ try{ sndWrong.currentTime=0; sndWrong.play(); }catch(e){} }
function primeAudio(){ [sndCorrect,sndWrong].forEach(a=>{ try{ const v=a.volume; a.volume=0; const p=a.play(); if(p&&p.then) p.then(()=>{a.pause();a.currentTime=0;a.volume=v;}).catch(()=>{a.volume=v;}); }catch(e){} }); }

// ---- Voz (leitura das perguntas via Text-to-Speech do navegador) ----
let voiceMode = "full"; // "full" | "question" | "off"
let voices = [], chosenVoice = null, voiceRate = 1.03;
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  try{
    let vs = speechSynthesis.getVoices() || [];
    if(!vs.length) return; // ainda não carregou; onvoiceschanged chamará de novo
    // português primeiro, depois em ordem alfabética
    voices = vs.slice().sort((a,b)=>{
      const pa=/^pt/i.test(a.lang)?0:1, pb=/^pt/i.test(b.lang)?0:1;
      return pa-pb || a.name.localeCompare(b.name);
    });
    const sel = $("#setVoiceName");
    if(sel){
      const prev = chosenVoice ? chosenVoice.voiceURI : "";
      sel.innerHTML = "";
      voices.forEach(v=>{ const o=document.createElement("option"); o.value=v.voiceURI; o.textContent=v.name+" ("+v.lang+")"; sel.appendChild(o); });
      const def = voices.find(v=>/pt[-_]?br/i.test(v.lang)) || voices.find(v=>/^pt/i.test(v.lang)) || voices[0];
      const keep = prev && voices.find(v=>v.voiceURI===prev);
      chosenVoice = keep || def || null;
      if(chosenVoice) sel.value = chosenVoice.voiceURI;
    }
  }catch(e){}
}
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
function speak(text, onend){
  if(voiceMode==="off" || !("speechSynthesis" in window)){ if(onend) onend(); return; }
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(chosenVoice){ u.voice=chosenVoice; u.lang=chosenVoice.lang; } else { u.lang="pt-BR"; }
    u.rate=voiceRate;
    if(onend){ u.onend=onend; u.onerror=onend; }
    speechSynthesis.speak(u);
  }catch(e){ if(onend) onend(); }
}
function stopSpeak(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
function warmSpeech(){ if(voiceMode==="off"||!("speechSynthesis" in window)) return; try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} }

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#"+id).classList.on=true; $("#"+id).classList.add("on"); }

// ---- criar sala ao abrir ----
socket.emit("host:create");
socket.on("host:created", ({code, lanUrl, categories})=>{
  ROOM = code;
  $("#code").textContent = code; $("#gCode").textContent = code;
  // usa a URL de rede local se a página foi aberta em localhost
  let base = location.origin;
  if (/localhost|127\.0\.0\.1/.test(base) && lanUrl) base = lanUrl;
  const joinUrl = base + "/player.html?room=" + code;
  $("#url").textContent = joinUrl;
  $("#qr").innerHTML = "";
  new QRCode($("#qr"), { text: joinUrl, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  const sel = $("#setCat"); sel.innerHTML = "";
  categories.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o); });
});

// ---- modo individual/equipes ----
$("#modes").querySelectorAll(".chip").forEach(b=>{
  b.onclick = ()=>{
    $("#modes").querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); MODE=b.dataset.m; Sfx.unlock();
    socket.emit("host:mode",{mode:MODE});
  };
});
socket.on("room:mode", ({mode})=>{ MODE=mode; });

// ---- lista de jogadores ----
socket.on("room:players", ({players, mode})=>{
  if(mode) MODE=mode;
  const online = players.filter(p=>p.online);
  const isTeam = MODE==="team";
  $("#lobbyPlayers").style.display = isTeam ? "none" : "flex";
  $("#lobbyTeams").style.display = isTeam ? "flex" : "none";
  $("#teamScore").style.display = isTeam ? "flex" : "none";

  if(isTeam){
    const fill=(el,arr)=>{ el.innerHTML=""; arr.forEach(p=>{ const d=document.createElement("div");
      d.className="pill"+(p.online?"":" off"); d.style.margin="4px 0"; d.textContent=p.name; el.appendChild(d); }); };
    fill($("#teamBlueList"), players.filter(p=>p.team==="blue"));
    fill($("#teamRedList"), players.filter(p=>p.team==="red"));
    const t=teamTotals(players); $("#tsBlue").textContent=t.blue; $("#tsRed").textContent=t.red;
  } else {
    const box = $("#lobbyPlayers"); box.innerHTML = "";
    players.forEach(p=>{ const d=document.createElement("div"); d.className="pill"+(p.online?"":" off"); d.textContent=p.name; box.appendChild(d); });
  }
  $("#startBtn").disabled = online.length < 2;
  $("#lobbyHint").textContent = online.length < 2 ? "Precisa de pelo menos 2 jogadores conectados." : online.length+" jogadores prontos!";
  renderBoard($("#board"), players);
});
function teamTotals(players){ let blue=0,red=0; players.forEach(p=>{ if(p.team==="blue")blue+=p.score; else if(p.team==="red")red+=p.score; }); return {blue,red}; }

$("#startBtn").onclick = ()=>{ Sfx.unlock(); Sfx.go(); primeAudio(); if(fsSupported()) goFullscreen(); voiceMode=$("#setVoice").value; warmSpeech(); socket.emit("host:start", {
  category: $("#setCat").value, count: $("#setCount").value, time: $("#setTime").value
}); };
$("#setVoice").onchange = ()=>{ voiceMode=$("#setVoice").value; if(voiceMode==="off") stopSpeak(); };
$("#setVoiceName").onchange = ()=>{ const uri=$("#setVoiceName").value; const v=voices.find(x=>x.voiceURI===uri); if(v) chosenVoice=v; };
$("#setRate").onchange = ()=>{ voiceRate = parseFloat($("#setRate").value)||1.03; };
$("#testVoice").onclick = ()=>{
  if(!("speechSynthesis" in window)){ toast("Este navegador não tem leitura de voz."); return; }
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance("Olá! Esta é a voz que vai ler as perguntas.");
    if(chosenVoice){ u.voice=chosenVoice; u.lang=chosenVoice.lang; } else u.lang="pt-BR";
    u.rate=voiceRate; speechSynthesis.speak(u);
  }catch(e){}
};
$("#nextBtn").onclick = ()=>{ stopSpeak(); socket.emit("host:next"); };
$("#restartBtn").onclick = ()=>{ stopSpeak(); socket.emit("host:restart"); };
$("#againBtn").onclick = ()=>{ stopSpeak(); socket.emit("host:restart"); };

socket.on("game:start", ()=> show("game"));
socket.on("game:lobby", ()=> show("lobby"));

// ---- nova pergunta ----
let readingDoneSent = true;
socket.on("game:question", ({index,total,category,question,options,time})=>{
  show("game");
  buzzWindow = time || 0;
  $("#counter").textContent = index+" / "+total;
  $("#cat").textContent = category;
  $("#q").textContent = question;
  const box = $("#opts"); box.innerHTML = "";
  options.forEach((t,k)=>{
    const d=document.createElement("div"); d.className="opt"; d.dataset.k=k;
    d.innerHTML = `<span class="tag">${LETTERS[k]}</span><span>${t}</span>`;
    box.appendChild(d);
  });
  stopTimer(); $("#fill").style.width="100%"; $("#fill").classList.remove("warn");

  readingDoneSent = false;
  const done = ()=>{ if(readingDoneSent) return; readingDoneSent=true; socket.emit("host:readingDone",{index}); };
  if(voiceMode!=="off"){
    setStatus("neutral","🔊 Lendo a pergunta…");
    let text = question;
    if(voiceMode==="full"){ text += ". " + options.map((o,i)=>"Opção "+LETTERS[i]+": "+o).join(". "); }
    speak(text, done);
    // segurança: se o onend não disparar, libera após um tempo estimado
    const est = Math.min(Math.max(text.length*70, 3500), 22000);
    setTimeout(done, est);
  } else {
    setStatus("neutral","🔴 Aguardando alguém apertar o botão…");
    done();
  }
});

// buzz liberado para todos (após a leitura)
socket.on("game:buzzopen", ()=>{
  setStatus("neutral","🔴 Aguardando alguém apertar o botão…");
  startTimer(buzzWindow);
});

// ---- alguém apertou o botão ----
socket.on("game:buzzed", ({by, answerTime, readyDelay})=>{
  stopSpeak();
  const nm = by.name + (by.team ? (by.team==="blue"?" 🔵":" 🔴") : "");
  setStatus("neutral","⚡ "+nm+" travou! Preparando…");
  Sfx.tick();
  stopTimer(); $("#fill").style.width="100%";
  setTimeout(()=>{ setStatus("neutral","🎤 "+nm+" respondendo… ("+answerTime+"s)"); startTimer(answerTime); }, (readyDelay||1)*1000);
});

// ---- errou ou estourou o tempo: reabre para os outros ----
socket.on("game:reopen", ({wrongPlayer, timedOut, scores, teamScores})=>{
  const msg = timedOut ? `⏱ ${wrongPlayer.name} não respondeu a tempo!` : `❌ ${wrongPlayer.name} errou e perdeu 1 ponto!`;
  setStatus("bad", msg+" Liberado — quem apertar primeiro responde.");
  if(!timedOut) playWrong();
  if(scores) renderBoard($("#board"), scores);
  if(teamScores){ $("#tsBlue").textContent=teamScores.blue; $("#tsRed").textContent=teamScores.red; }
  startTimer(buzzWindow);
});

// ---- resultado ----
socket.on("game:result", ({correctIndex, awardedTo, wrongPlayer, timeout, allWrong, scores, teamScores, mode})=>{
  stopSpeak();
  stopTimer();
  document.querySelectorAll("#opts .opt").forEach(o=>{
    if(+o.dataset.k===correctIndex) o.classList.add("right"); else o.classList.add("dim");
  });
  const isTeam = (mode||MODE)==="team";
  const who = t => t==="blue" ? "time Azul 🔵" : "time Vermelha 🔴";
  if(timeout){ setStatus("neutral","⏱ Tempo esgotado! Ninguém pontuou."); }
  else if(awardedTo && wrongPlayer){
    const alvo = isTeam ? who(awardedTo.team) : awardedTo.name;
    setStatus("good", `❌ ${wrongPlayer.name} errou — ponto para ${alvo}! ✅`); playCorrect();
  }
  else if(awardedTo){
    const alvo = isTeam ? who(awardedTo.team) : awardedTo.name;
    setStatus("good", `✅ ${awardedTo.name} acertou — ponto para ${alvo}!`); playCorrect();
  }
  else if(allWrong){ setStatus("bad","Ninguém acertou desta vez."); playWrong(); }
  else setStatus("neutral","");
  renderBoard($("#board"), scores);
  if(isTeam && teamScores){ $("#tsBlue").textContent=teamScores.blue; $("#tsRed").textContent=teamScores.red; }
});

socket.on("game:over", ({scores, teamScores, mode})=>{
  stopSpeak();
  show("over");
  if((mode||MODE)==="team" && teamScores){
    const {blue,red}=teamScores;
    if(blue>red) $("#winner").textContent="🔵 Time Azul venceu! 🏆";
    else if(red>blue) $("#winner").textContent="🔴 Time Vermelha venceu! 🏆";
    else $("#winner").textContent="Empate! 🤝";
    $("#finalBoard").innerHTML =
      `<div class="row lead"><span>🔵 Azul</span><span class="s">${blue}</span></div>`+
      `<div class="row lead"><span>🔴 Vermelha</span><span class="s">${red}</span></div>`;
    playCorrect();
    return;
  }
  const top = scores[0];
  const tie = scores.length>1 && scores[1] && scores[1].score===top.score;
  $("#winner").textContent = tie ? "Empate! 🤝" : `🏆 ${top? top.name : "-"} venceu!`;
  renderBoard($("#finalBoard"), scores, true);
  playCorrect();
});

socket.on("room:closed", ()=>{ /* host fechou */ });

// ---- helpers ----
function setStatus(kind,text){ const s=$("#status"); s.className="status "+kind; s.textContent=text; }
function renderBoard(el, players, medals=false){
  const sorted = [...players].sort((a,b)=>b.score-a.score);
  el.innerHTML = "";
  sorted.forEach((p,i)=>{
    const r=document.createElement("div"); r.className="row"+(i===0&&p.score>0?" lead":"");
    const medal = medals ? ["🥇","🥈","🥉"][i] || "" : "";
    r.innerHTML = `<span>${medal} ${p.name}${p.online===false?" 💤":""}</span><span class="s">${p.score}</span>`;
    el.appendChild(r);
  });
  if(sorted.length===0) el.innerHTML = '<div class="row"><span style="opacity:.6">Sem jogadores ainda</span></div>';
}
function startTimer(time){
  stopTimer(); const fill=$("#fill");
  if(!time || time<=0){ fill.style.width="100%"; fill.classList.remove("warn"); return; }
  curTime=time; fill.classList.remove("warn"); fill.style.width="100%";
  timerInt=setInterval(()=>{
    curTime--; const pct=Math.max(curTime,0)/time*100;
    fill.style.width=pct+"%"; fill.classList.toggle("warn", curTime<=Math.max(time*0.35,4));
    if(curTime<=3 && curTime>0) Sfx.tick();
    if(curTime<=0) stopTimer();
  },1000);
}
function stopTimer(){ clearInterval(timerInt); timerInt=null; }
</script>
</body>
</html>
