<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Show">
<meta name="theme-color" content="#241b4a">
<title>Quiz Show — Jogador</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--a:#e8505b;--b:#3a86ff;--c:#f6a609;--d:#2fbf71;--gold:#ffd166;
    --ink:#f5f2ff;--soft:#c4bce6;--dim:#8f86bd;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);min-height:100dvh;padding:16px;
    background:radial-gradient(800px 500px at 80% -10%,#4a2a7a,transparent 55%),
      linear-gradient(160deg,#241b4a,#1b1440);display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column} .screen.on{display:flex}
  h1{font-family:"Space Grotesk";font-weight:700;font-size:1.9rem;text-align:center}
  .kicker{color:var(--gold);font-family:"Space Grotesk";font-weight:600;letter-spacing:1px;text-align:center;margin-bottom:8px}

  /* JOIN */
  .join{margin:auto;width:100%;max-width:420px;text-align:center}
  .field{margin:14px 0;text-align:left}
  .field label{font-size:.8rem;color:var(--dim);font-family:"Space Grotesk";display:block;margin-bottom:6px}
  input{width:100%;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:14px;
    padding:15px;color:var(--ink);font-family:inherit;font-size:1.1rem;font-weight:600}
  input:focus{outline:none;border-color:var(--gold)}
  #code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:"Space Grotesk"}
  .btn{width:100%;border:none;cursor:pointer;font-family:"Space Grotesk";font-weight:700;font-size:1.2rem;
    color:#241245;background:var(--gold);padding:17px;border-radius:15px;margin-top:8px}
  .btn:disabled{opacity:.5}
  .err{color:var(--a);margin-top:10px;font-size:.9rem;min-height:1.2em}

  /* HEADER do jogo */
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .me{font-family:"Space Grotesk";font-weight:600}
  .myscore{font-family:"Space Grotesk";font-weight:700;color:var(--gold);font-size:1.3rem}
  .rank{color:var(--dim);font-size:.85rem}

  /* WAIT */
  .wait{margin:auto;text-align:center}
  .dots{font-size:2rem;letter-spacing:4px;color:var(--gold);animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  /* QUESTION */
  .cat{align-self:center;font-size:.8rem;font-weight:700;color:#241b4a;background:var(--soft);
    padding:5px 14px;border-radius:999px;margin-bottom:10px}
  .q{font-family:"Space Grotesk";font-weight:600;font-size:1.35rem;line-height:1.3;text-align:center;margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:auto}
  .opt{display:flex;align-items:center;gap:14px;border:2px solid rgba(255,255,255,.55);cursor:pointer;text-align:left;
    color:#fff;background:#141018;font-size:1.15rem;font-weight:600;font-family:inherit;border-radius:16px;padding:18px 16px;
    transition:transform .1s, filter .15s}
  .opt:active{transform:scale(.98)}
  .opt .tag{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#fff;color:#141018;
    font-family:"Space Grotesk";font-weight:700}
  .opts.locked .opt{cursor:default}
  .opt.dim{filter:brightness(.5);opacity:.5}
  .opt.right{background:#fff;color:#141018;border-color:#fff}
  .opt.right .tag{background:#141018;color:#fff}
  .opt.mine-wrong{border-color:#fff;border-style:dashed}
  .banner{text-align:center;font-family:"Space Grotesk";font-weight:600;font-size:1.1rem;margin:14px 0;min-height:1.4em}
  .banner.good{color:var(--d)} .banner.bad{color:var(--a)} .banner.neutral{color:var(--gold)}

  .center{margin:auto;text-align:center}

  /* botão grande de buzz (vira a imagem quando liberado) + timer de resposta */
  .buzz{width:100%;border:none;cursor:pointer;background:transparent;color:var(--soft);font-family:"Space Grotesk";
    font-weight:700;font-size:1.25rem;padding:8px;margin-top:auto;display:flex;flex-direction:column;align-items:center;
    gap:12px;transition:transform .08s}
  .buzz:active{transform:scale(.95)}
  .buzz:disabled{cursor:default}
  .buzz img{width:320px;max-width:82vw;pointer-events:none;transition:filter .2s;filter:grayscale(1) brightness(.5)}
  .buzz.ready img{filter:drop-shadow(0 14px 26px rgba(220,20,20,.55))}
  .buzz.ready{color:#fff}
  #buzzLabel{letter-spacing:.5px}
  .ptimer{height:12px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:4px 0 14px}
  .ptimerfill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#2fbf71,#ffd166);transition:width 1s linear}
  .ptimer.warn .ptimerfill{background:linear-gradient(90deg,#f6a609,#e8505b)}

  /* escolha de time */
  .teamPick{display:flex;gap:12px;margin:20px 0}
  .tbtn{flex:1;border:3px solid transparent;cursor:pointer;font-family:"Space Grotesk";font-weight:700;
    font-size:1.15rem;color:#fff;padding:22px 10px;border-radius:18px;opacity:.75;transition:.15s}
  .tbtn.blue{background:#3a86ff} .tbtn.red{background:#e8505b}
  .tbtn.sel{opacity:1;border-color:#fff;transform:translateY(-2px)}
  .myteam{font-family:"Space Grotesk";font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px}
  .myteam.blue{background:rgba(58,134,255,.25);color:#7cb0ff}
  .myteam.red{background:rgba(232,80,91,.25);color:#ff8b93}

  /* celular deitado (paisagem, pouca altura) */
  @media (orientation:landscape) and (max-height:520px){
    body{padding:10px}
    h1{font-size:1.4rem}
    .phead{margin-bottom:8px}
    .cat{margin-bottom:6px}
    .q{font-size:1.1rem;margin-bottom:8px}
    .banner{font-size:.95rem;margin:8px 0}
    .ptimer{height:10px;margin:2px 0 8px}
    .buzz{font-size:1.3rem;padding:20px 12px;margin-top:6px}
    .buzz img{width:auto;height:150px;max-width:44vw}
    .buzz br{display:none}
    .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .opt{padding:12px;font-size:1rem}
    .opt .tag{flex-basis:30px;height:30px}
    .teamPick{margin:12px 0} .tbtn{padding:16px 10px;font-size:1.05rem}
    .field{margin:8px 0} input{padding:11px}
    .dots{font-size:1.4rem}
  }
</style>
</head>
<body>

<!-- JOIN -->
<section id="join" class="screen on">
  <div class="join">
    <div class="kicker">◆ QUIZ SHOW ◆</div>
    <h1>Entrar no jogo</h1>
    <div class="field"><label>Código da sala</label>
      <input id="code" maxlength="4" placeholder="XXXX" autocomplete="off"></div>
    <div class="field"><label>Seu nome</label>
      <input id="name" maxlength="16" placeholder="Seu apelido" autocomplete="off"></div>
    <button class="btn" id="joinBtn">Entrar ▶</button>
    <div class="err" id="err"></div>
  </div>
</section>

<!-- WAIT -->
<section id="wait" class="screen">
  <div class="phead">
    <span class="me" id="wName">—</span>
    <span class="myscore" id="wScore">★ 0</span>
  </div>
  <div class="wait">
    <div class="kicker">VOCÊ ESTÁ DENTRO ✔</div>
    <h1 id="wMsg">Aguardando o host…</h1>
    <div id="teamPick" class="teamPick" style="display:none">
      <button class="tbtn blue" data-team="blue">🔵 Azul</button>
      <button class="tbtn red" data-team="red">🔴 Vermelha</button>
    </div>
    <div class="dots">● ● ●</div>
  </div>
</section>

<!-- QUESTION -->
<section id="play" class="screen">
  <div class="phead">
    <span class="me" id="pName">—</span>
    <span><span class="myteam" id="pTeam" style="display:none"></span>
      <span class="rank" id="pRank"></span> <span class="myscore" id="pScore">★ 0</span></span>
  </div>
  <span class="cat" id="cat">Tema</span>
  <div class="q" id="q">…</div>
  <div class="banner neutral" id="banner">Aperte o botão para responder!</div>
  <div id="pTimer" class="ptimer" style="display:none"><div id="pTimerFill" class="ptimerfill"></div></div>
  <button id="buzzBtn" class="buzz" disabled>
    <img id="buzzImg" src="botao.png" alt="Botão responder">
    <span id="buzzLabel">AGUARDE A LEITURA…</span>
  </button>
  <div class="opts" id="opts" style="display:none"></div>
</section>

<!-- OVER -->
<section id="over" class="screen">
  <div class="center">
    <div class="kicker">FIM DE JOGO</div>
    <h1 id="overMsg">🏆</h1>
    <div class="myscore" id="overScore" style="font-size:2rem;margin-top:12px">★ 0</div>
    <p class="rank" id="overRank" style="margin-top:8px"></p>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const socket = io();
let ME=null, MYNAME="", LETTERS=["A","B","C","D"], answered=false, MODE="solo", MYTEAM=null;
let amResponder=false, pInt=null;

// ---- Sons de acerto/erro (arquivos MP3) ----
const sndCorrect = new Audio("acerto.mp3");
const sndWrong = new Audio("erro.mp3");
function playCorrect(){ try{ sndCorrect.currentTime=0; sndCorrect.play(); }catch(e){} }
function playWrong(){ try{ sndWrong.currentTime=0; sndWrong.play(); }catch(e){} }
function primeAudio(){ [sndCorrect,sndWrong].forEach(a=>{ try{ const v=a.volume; a.volume=0; const p=a.play(); if(p&&p.then) p.then(()=>{a.pause();a.currentTime=0;a.volume=v;}).catch(()=>{a.volume=v;}); }catch(e){} }); }

// ---- Áudio ----
const Sfx = (()=>{
  let ctx;
  const ensure=()=>{ try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); }catch(e){} return ctx; };
  const tone=(f,d,t="sine",g=0.15,w=0)=>{ const c=ensure(); if(!c) return; const o=c.createOscillator(),ga=c.createGain();
    o.type=t;o.frequency.value=f;o.connect(ga);ga.connect(c.destination);const s=c.currentTime+w;
    ga.gain.setValueAtTime(0.0001,s);ga.gain.exponentialRampToValueAtTime(g,s+0.01);
    ga.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.03); };
  return { unlock:ensure,
    correct(){ tone(660,0.12,"sine",0.2); tone(990,0.18,"sine",0.2,0.12); },
    wrong(){ tone(160,0.3,"sawtooth",0.22); },
    tap(){ tone(520,0.05,"square",0.1); } };
})();

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#"+id).classList.add("on"); }

// pré-preenche o código vindo do QR
const roomParam = new URLSearchParams(location.search).get("room");
if(roomParam){ $("#code").value = roomParam.toUpperCase(); }

$("#joinBtn").onclick = join;
$("#name").addEventListener("keydown", e=>{ if(e.key==="Enter") join(); });
function join(){
  Sfx.unlock(); primeAudio();
  const code=$("#code").value.trim().toUpperCase(), name=$("#name").value.trim();
  if(code.length<4){ $("#err").textContent="Digite o código de 4 letras."; return; }
  if(!name){ $("#err").textContent="Digite seu nome."; return; }
  $("#joinBtn").disabled=true; $("#err").textContent="";
  socket.emit("player:join",{code,name},(res)=>{
    $("#joinBtn").disabled=false;
    if(!res||!res.ok){ $("#err").textContent=(res&&res.error)||"Erro ao entrar."; return; }
    ME=res.playerId; MYNAME=res.name; MODE=res.mode||"solo";
    $("#wName").textContent=MYNAME; $("#pName").textContent=MYNAME;
    updateTeamPick();
    show("wait");
  });
}

// escolha de time
document.querySelectorAll("#teamPick .tbtn").forEach(b=>{
  b.onclick=()=>{ Sfx.tap(); socket.emit("player:team",{team:b.dataset.team}); };
});
socket.on("room:mode", ({mode})=>{ MODE=mode; updateTeamPick(); });
function updateTeamPick(){
  const show = MODE==="team";
  $("#teamPick").style.display = show ? "flex" : "none";
  if(show) $("#wMsg").textContent = MYTEAM ? "Time escolhido! Aguarde…" : "Escolha seu time 👇";
  else $("#wMsg").textContent = "Aguardando o host…";
  document.querySelectorAll("#teamPick .tbtn").forEach(b=>b.classList.toggle("sel", b.dataset.team===MYTEAM));
}

// placar / meu ranking
socket.on("room:players", ({players, mode})=>{
  if(mode) MODE=mode;
  const me = players.find(p=>p.id===ME);
  if(me){ MYTEAM = me.team || MYTEAM; }
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  const pos = me ? sorted.findIndex(p=>p.id===ME)+1 : 0;
  const sc = me? me.score : 0;
  $("#wScore").textContent="★ "+sc; $("#pScore").textContent="★ "+sc; $("#overScore").textContent="★ "+sc;
  if(pos){ $("#pRank").textContent = pos+"º de "+players.length; }
  // selo do time
  const badge=$("#pTeam");
  if(MODE==="team" && MYTEAM){ badge.style.display="inline-block"; badge.className="myteam "+MYTEAM;
    badge.textContent = MYTEAM==="blue"?"🔵 Azul":"🔴 Vermelha"; }
  else badge.style.display="none";
  updateTeamPick();
});

socket.on("game:start", ()=>{ /* espera a primeira pergunta */ });
socket.on("game:lobby", ()=>{ show("wait"); $("#wMsg").textContent="Aguardando o host…"; });

// nova pergunta → mostra o botão de buzz, esconde as opções
socket.on("game:question", ({category,question,options,answerTime})=>{
  answered=false; amResponder=false; ANSWER_T = answerTime||10;
  show("play");
  $("#cat").textContent=category; $("#q").textContent=question;
  const box=$("#opts"); box.className="opts"; box.style.display="none"; box.innerHTML="";
  options.forEach((t,k)=>{
    const b=document.createElement("button"); b.className="opt"; b.dataset.k=k;
    b.innerHTML=`<span class="tag">${LETTERS[k]}</span><span>${t}</span>`;
    b.onclick=()=>choose(k);
    box.appendChild(b);
  });
  stopLocalTimer();
  const bb=$("#buzzBtn"); bb.style.display="flex"; bb.disabled=true; bb.classList.remove("ready");
  $("#buzzLabel").textContent="AGUARDE A LEITURA…";
  banner("neutral","🔊 Ouça a pergunta na TV…");
});

// leitura terminou → libera o botão (vira a imagem vermelha)
socket.on("game:buzzopen", ()=>{
  if(answered || amResponder) return;
  const bb=$("#buzzBtn"); bb.style.display="flex"; bb.disabled=false; bb.classList.add("ready");
  $("#buzzLabel").textContent="APERTE PARA RESPONDER";
  banner("good","✅ Pode apertar!");
});

let ANSWER_T = 10;
$("#buzzBtn").onclick = buzz;
function buzz(){
  const bb=$("#buzzBtn");
  if(bb.disabled) return;
  Sfx.unlock(); Sfx.tap();
  bb.disabled=true; bb.classList.remove("ready");
  $("#buzzLabel").textContent="⏳ Tentando travar…";
  socket.emit("player:buzz");
}

// EU apertei o botão → libera minhas opções (sem depender de comparar IDs)
socket.on("game:youbuzzed", ({answerTime, readyDelay})=>{
  amResponder=true;
  const t = answerTime||ANSWER_T, delay=(readyDelay||1)*1000;
  $("#buzzBtn").style.display="none";
  $("#opts").style.display="none";
  banner("neutral","⏳ Preparando…");
  Sfx.tap();
  setTimeout(()=>{
    const box=$("#opts"); box.style.display="flex"; box.className="opts";
    banner("good","⚡ Sua vez! Responda rápido!");
    startLocalTimer(t);
  }, delay);
});

// OUTRO jogador apertou → eu fico bloqueado
socket.on("game:buzzed", ({by})=>{
  if(amResponder) return;
  $("#buzzBtn").style.display="none";
  $("#opts").style.display="none";
  banner("neutral","🔒 "+(by&&by.name?by.name:"Alguém")+" está respondendo…");
  stopLocalTimer();
});

function choose(k){
  if(!amResponder || answered) return;
  answered=true; amResponder=false; Sfx.tap();
  stopLocalTimer();
  $("#opts").classList.add("locked");
  document.querySelectorAll("#opts .opt").forEach(o=>{ if(+o.dataset.k!==k) o.classList.add("dim"); });
  banner("neutral","Enviado! Aguarde…");
  socket.emit("player:answer",{optionIndex:k});
}

// erro/tempo esgotado: reabre para os outros
socket.on("game:reopen", ({wrongPlayer, lockedOut, timedOut, scores})=>{
  stopLocalTimer(); answered=false; amResponder=false;
  $("#opts").style.display="none";
  if(scores){ const me=scores.find(p=>p.id===ME); if(me){ const s="★ "+me.score; $("#pScore").textContent=s; $("#wScore").textContent=s; } }
  const iAmOut = lockedOut.includes(ME);
  if(iAmOut){
    $("#buzzBtn").style.display="none";
    if(wrongPlayer.id===ME){
      if(timedOut){ banner("bad","⏱ Você não respondeu a tempo."); }
      else { banner("bad","❌ Você errou — perdeu 1 ponto!"); playWrong(); }
    } else { banner("bad","Aguarde os outros…"); }
  } else {
    const bb=$("#buzzBtn"); bb.style.display="flex"; bb.disabled=false; bb.classList.add("ready");
    $("#buzzLabel").textContent="APERTE PARA RESPONDER";
    banner("good","⚡ Liberado! Aperte para responder!");
  }
});

// resultado
socket.on("game:result", ({correctIndex, awardedTo, wrongPlayer, timeout, allWrong, mode})=>{
  stopLocalTimer();
  $("#buzzBtn").style.display="none";
  const box=$("#opts"); box.style.display="flex"; box.classList.add("locked");
  document.querySelectorAll("#opts .opt").forEach(o=>{
    if(+o.dataset.k===correctIndex) o.classList.add("right"); else o.classList.add("dim");
  });
  const isTeam=(mode||MODE)==="team";
  const teamName = t => t==="blue" ? "time Azul 🔵" : "time Vermelha 🔴";
  const iWon = awardedTo && awardedTo.id===ME;
  const iLost = wrongPlayer && wrongPlayer.id===ME;
  const myTeamScored = isTeam && awardedTo && awardedTo.team && awardedTo.team===MYTEAM;

  if(iWon){ banner("good","✅ Você acertou! "+(isTeam?"+1 para o "+teamName(MYTEAM):"+1 ponto")); playCorrect(); }
  else if(iLost && awardedTo){ banner("bad","❌ Você errou — ponto para "+(isTeam?teamName(awardedTo.team):awardedTo.name)); playWrong(); }
  else if(iLost){ banner("bad","❌ Não foi dessa vez."); playWrong(); }
  else if(timeout){ banner("neutral","⏱ Ninguém apertou a tempo."); }
  else if(myTeamScored){ banner("good","✅ Seu "+teamName(MYTEAM)+" pontuou!"); playCorrect(); }
  else if(awardedTo){ banner("neutral","✅ "+(isTeam?teamName(awardedTo.team):awardedTo.name)+" pontuou."); }
  else banner("neutral","Ninguém acertou.");
});

// timer local de resposta (visual)
function startLocalTimer(sec){
  stopLocalTimer();
  const wrap=$("#pTimer"), fill=$("#pTimerFill");
  wrap.style.display="block"; wrap.classList.remove("warn"); fill.style.width="100%";
  let t=sec;
  pInt=setInterval(()=>{
    t--; fill.style.width=Math.max(t,0)/sec*100+"%";
    wrap.classList.toggle("warn", t<=4);
    if(t<=0) stopLocalTimer();
  },1000);
}
function stopLocalTimer(){ clearInterval(pInt); pInt=null; $("#pTimer").style.display="none"; }

socket.on("game:over", ({scores, teamScores, mode})=>{
  show("over");
  if((mode||MODE)==="team" && teamScores){
    const {blue,red}=teamScores;
    const myWon = (MYTEAM==="blue"&&blue>red)||(MYTEAM==="red"&&red>blue);
    const tie = blue===red;
    $("#overMsg").textContent = tie ? "Empate! 🤝" : (myWon ? "🏆 Seu time venceu!" : "Seu time perdeu 😕");
    $("#overRank").textContent = `🔵 Azul ${blue}  ×  ${red} Vermelha 🔴`;
    myWon ? Sfx.correct() : (tie ? null : Sfx.wrong());
    return;
  }
  const sorted=[...scores].sort((a,b)=>b.score-a.score);
  const pos=sorted.findIndex(p=>p.id===ME)+1;
  const top=sorted[0];
  if(top && top.id===ME){ $("#overMsg").textContent="🏆 Você venceu!"; Sfx.correct(); }
  else $("#overMsg").textContent="Fim! Você ficou em "+(pos||"-")+"º";
  $("#overRank").textContent = pos ? (pos+"º lugar de "+sorted.length) : "";
});

socket.on("room:closed", ()=>{
  show("join"); $("#err").textContent="O host encerrou a sala.";
});

function banner(kind,text){ const b=$("#banner"); b.className="banner "+kind; b.textContent=text; }
</script>
</body>
</html>
